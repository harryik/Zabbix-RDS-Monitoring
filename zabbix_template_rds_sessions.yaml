zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 2b6fbcb9fd8b4a1c9ee58cf23cd43f42
      template: 'Windows RDS sessions by Zabbix agent 2'
      name: 'Windows RDS sessions by Zabbix agent 2'
      description: |
        Native Windows RDS / interactive session monitoring using rds-session.exe.

        One Zabbix agent master item runs the collector and returns JSON.
        Dependent items provide aggregate session counters and low-level discovery creates per-session state, idle time and logon time items.

        Session instances are identified by a stable session_uid built from Windows Session ID and the session logon timestamp, preventing history from being mixed when Windows reuses a Session ID.

        The collector uses the Windows WTS API directly and does not require PowerShell or .NET.
      groups:
        - name: Templates
      tags:
        - tag: class
          value: os
        - tag: target
          value: windows
        - tag: component
          value: rds
      items:
        - uuid: 00df54dc8c7a45f4a2797a3b358b3c0d
          name: 'RDS: Sessions raw'
          key: windows.rds.sessions.get
          delay: 5m
          history: 1d
          trends: '0'
          value_type: TEXT
          description: 'Master JSON returned by rds-session.exe. This is the only item that executes the collector.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var sessions = JSON.parse(value);
                  if (!Array.isArray(sessions)) {
                      throw 'Expected a JSON array of sessions';
                  }
                  return value;
          triggers:
            - uuid: e47c3545727746df85d6c2993ee05b47
              expression: 'nodata(/Windows RDS sessions by Zabbix agent 2/windows.rds.sessions.get,15m)=1'
              name: 'RDS: No valid session data for 15 minutes'
              priority: WARNING
              description: 'The collector has not returned a valid JSON session array for three polling intervals.'
              tags:
                - tag: component
                  value: rds
          tags:
            - tag: Application
              value: 'RDS Sessions'
            - tag: component
              value: rds
            - tag: data
              value: raw
        - uuid: 13070a9553a246329be42424c4a8b6fd
          name: 'RDS: Total sessions'
          type: DEPENDENT
          key: windows.rds.sessions.total
          delay: '0'
          history: 30d
          value_type: UNSIGNED
          description: 'Number of interactive user sessions returned by the collector, regardless of WTS state.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: windows.rds.sessions.get
          tags:
            - tag: Application
              value: 'RDS Sessions'
            - tag: component
              value: rds
            - tag: scope
              value: summary
        - uuid: 44e7a44380bb4a61ab58e70809c6530a
          name: 'RDS: Active sessions'
          type: DEPENDENT
          key: windows.rds.sessions.active
          delay: '0'
          history: 30d
          value_type: UNSIGNED
          description: 'Number of sessions whose WTS state is Active.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.state == "Active")].length()'
          master_item:
            key: windows.rds.sessions.get
          tags:
            - tag: Application
              value: 'RDS Sessions'
            - tag: component
              value: rds
            - tag: scope
              value: summary
        - uuid: d1d61df80da9452aa34ce2e8109f3af2
          name: 'RDS: Disconnected sessions'
          type: DEPENDENT
          key: windows.rds.sessions.disconnected
          delay: '0'
          history: 30d
          value_type: UNSIGNED
          description: 'Number of sessions whose WTS state is Disconnected.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.state == "Disconnected")].length()'
          master_item:
            key: windows.rds.sessions.get
          tags:
            - tag: Application
              value: 'RDS Sessions'
            - tag: component
              value: rds
            - tag: scope
              value: summary
      discovery_rules:
        - uuid: 7a3b7df50d04423f981c7f1fa1e5b491
          name: 'RDS: Session discovery'
          type: DEPENDENT
          key: windows.rds.sessions.discovery
          lifetime: 1h
          lifetime_type: DELETE_AFTER
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Discovers interactive Windows session instances from the master JSON. Lost sessions are disabled immediately and deleted after one hour.'
          item_prototypes:
            - uuid: 8f6eed4e02a84e1c9e65ef7855a151ad
              name: 'RDS session [{#SESSIONID}] {#USER} ({#SESSION}): State'
              type: DEPENDENT
              key: 'windows.rds.session.state[{#SESSIONUID}]'
              delay: '0'
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'Current WTS connection state of the discovered session instance.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.session_uid == "{#SESSIONUID}")].state.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: windows.rds.sessions.get
              tags:
                - tag: Application
                  value: 'RDS Sessions'
                - tag: component
                  value: rds-session
                - tag: session
                  value: '{#SESSION}'
                - tag: sessionid
                  value: '{#SESSIONID}'
                - tag: sessionuid
                  value: '{#SESSIONUID}'
                - tag: user
                  value: '{#USER}'
            - uuid: 458bf83aa4bc487f98b4102814c1bdc4
              name: 'RDS session [{#SESSIONID}] {#USER} ({#SESSION}): Idle time'
              type: DEPENDENT
              key: 'windows.rds.session.idle[{#SESSIONUID}]'
              delay: '0'
              history: 7d
              value_type: UNSIGNED
              units: s
              description: 'Seconds since the last user input reported for the discovered session instance.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.session_uid == "{#SESSIONUID}")].idle_seconds.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: windows.rds.sessions.get
              tags:
                - tag: Application
                  value: 'RDS Sessions'
                - tag: component
                  value: rds-session
                - tag: session
                  value: '{#SESSION}'
                - tag: sessionid
                  value: '{#SESSIONID}'
                - tag: sessionuid
                  value: '{#SESSIONUID}'
                - tag: user
                  value: '{#USER}'
            - uuid: 918bc64f79cc4c52a2c530c6f4d4de65
              name: 'RDS session [{#SESSIONID}] {#USER} ({#SESSION}): Logon time'
              type: DEPENDENT
              key: 'windows.rds.session.logon[{#SESSIONUID}]'
              delay: '0'
              history: 7d
              trends: '0'
              value_type: CHAR
              description: 'Local logon timestamp with UTC offset returned by the collector for the discovered session instance.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.session_uid == "{#SESSIONUID}")].logon_time.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: windows.rds.sessions.get
              tags:
                - tag: Application
                  value: 'RDS Sessions'
                - tag: component
                  value: rds-session
                - tag: session
                  value: '{#SESSION}'
                - tag: sessionid
                  value: '{#SESSIONID}'
                - tag: sessionuid
                  value: '{#SESSIONUID}'
                - tag: user
                  value: '{#USER}'
          master_item:
            key: windows.rds.sessions.get
          lld_macro_paths:
            - lld_macro: '{#SESSIONUID}'
              path: $.session_uid
            - lld_macro: '{#SESSIONID}'
              path: $.id
            - lld_macro: '{#USER}'
              path: $.user
            - lld_macro: '{#SESSION}'
              path: $.session
